{% extends "feed_base.html" %}
{% block content %}
<header class="topbar">
  <div class="brand"><a href="/">{{ title }}</a></div>
</header>
<main class="page">
  <article class="entry-page">
    {{ body|safe }}
    <p class="page-meta"><time>{{ created_utc }}</time></p>
    <nav class="page-actions">
      {% match open_attr %}{% when Some with (target) %}<a href="{{ target|safe }}">Open</a>{% else %}{% endmatch %}
      <a href="/qr/{{ id }}">QR</a>
      <a href="/?around={{ id }}">Back to feed</a>
    </nav>
  </article>
</main>
<script src="/static/highlight/highlight.min.js"></script>
<script>document.querySelectorAll('pre code').forEach(function (el) { hljs.highlightElement(el); });</script>
{% endblock %}
