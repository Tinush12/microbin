[package]
name = "microbin"
version = "2.1.4"
edition = "2021"
rust-version = "1.88.0"
license = "BSD-3-Clause"
description = "Self-hosted, chat-style personal feed for text, links, images and files."
readme = "README.md"
repository = "https://github.com/Tinush12/microbin"
keywords = ["pastebin", "filesharing", "microbin", "actix", "selfhosted"]


[dependencies]
actix-files = "0.6.6"
actix-multipart = "0.7.2"
actix-web = { version = "4", default-features = false, features = [
"http2", "macros", "unicode"] }
actix-web-httpauth = "0.8.2"
askama = "0.10"
bytesize = { version = "1.1", features = ["serde"] }
chrono = "0.4.19"
clap = { version = "3.1.12", features = ["derive", "env"] }
env_logger = "0.9.0"
futures = "0.3"
html-escape = "0.2.13"
lazy_static = "1.4.0"
log = "0.4.21"
mime_guess = "2.0.4"
qrcode-generator = "4.1.9"
rusqlite = { version = "0.32", features = ["bundled"] }
rust-embed = "8.3.0"


sanitize-filename = "0.5.0"
serde_json = "1.0.114"
serde = { version = "1.0.197", features = ["derive"] }
tempfile = "3.25.0"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
ammonia = "4"


[profile.release]
lto = true
strip = true
