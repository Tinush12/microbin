services:
  microbin:
    build: .
    restart: always
    ports:
     - "${MICROBIN_PORT:-8080}:8080"
    volumes:
     # Named volume: Docker initialises it from the image with the correct
     # ownership (uid/gid 65532) so the nonroot user can write to it.
     # To use a bind-mount instead, replace the line below with:
     #   - ./microbin-data:/app/microbin_data
     # and ensure the host directory is owned by uid 65532:
     #   mkdir -p ./microbin-data && chown 65532:65532 ./microbin-data
     - microbin_data:/app/microbin_data
    environment:
      MICROBIN_BASIC_AUTH_USERNAME: ${MICROBIN_BASIC_AUTH_USERNAME:-}
      MICROBIN_BASIC_AUTH_PASSWORD: ${MICROBIN_BASIC_AUTH_PASSWORD:-}
      MICROBIN_TITLE: ${MICROBIN_TITLE:-microbin}
      MICROBIN_THREADS: ${MICROBIN_THREADS:-1}
      MICROBIN_MAX_FILE_SIZE_MB: ${MICROBIN_MAX_FILE_SIZE_MB:-2048}

volumes:
  microbin_data:
